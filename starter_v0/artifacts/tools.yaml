# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO(student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: >-
      Hỏi một câu ngắn gọn và chờ lượt trả lời tiếp theo khi thiếu hoặc mơ hồ
      input bắt buộc. Dùng response_type=text khi cần account, URL hoặc dữ liệu
      bổ sung. Dùng response_type=yes_no trước hành động gửi, đăng hoặc publish
      khi chưa có xác nhận rõ ràng. Không dùng khi user đã cung cấp đủ input.
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Một câu hỏi ngắn gọn, chỉ hỏi thông tin còn thiếu hoặc xác nhận cần thiết."}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "text cho thông tin còn thiếu; yes_no cho xác nhận hành động; choice khi cần chọn từ options."}
        options: {type: array, default: [], items: {type: string}, description: "Chỉ điền khi response_type=choice; nếu không dùng thì để rỗng."}
      required: [question, response_type]

  - name: timeline
    description: >-
      Lấy bài đăng gần đây từ một tài khoản cụ thể. Dùng khi user xác định một
      người hoặc account cụ thể, kể cả khi họ dùng tên người thay vì handle.
      Chuyển tên quen thuộc sang canonical handle khi không mơ hồ: Sam Altman
      -> sama, Elon Musk -> elonmusk, Andrej Karpathy -> karpathy. Chỉ gọi
      clarify khi user không xác định người/account nào hoặc danh tính thực sự
      mơ hồ. Không dùng để tìm bài theo keyword hoặc topic.
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Canonical account handle không có ký tự @. Ví dụ: Sam Altman -> sama; Elon Musk -> elonmusk; Andrej Karpathy -> karpathy."}
        limit: {type: integer, default: 5, description: "Số bài gần đây user yêu cầu; giữ nguyên con số được nêu trong request."}
      required: [screenname]

  - name: social_search
    description: >-
      Tìm bài đăng mạng xã hội theo keyword hoặc topic từ nhiều tài khoản. Dùng
      khi request hiện tại yêu cầu Twitter/X, social posts, thảo luận cộng đồng
      hoặc xu hướng mạng xã hội. Không dùng cho web search hoặc tin tức web.
      Nếu user nói bỏ Twitter/social và chuyển sang web, không gọi tool này;
      yêu cầu mới nhất ghi đè yêu cầu social trước đó.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Giữ nguyên chủ đề tìm kiếm của user; không tự thêm từ hoặc đổi nghĩa."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Top khi user yêu cầu phổ biến/top; Latest khi yêu cầu mới nhất/gần đây."}
        limit: {type: integer, default: 5, description: "Số bài user yêu cầu; giữ nguyên con số được nêu trong request."}
      required: [query]

  - name: lookup
    description: >-
      Tìm kiếm trên web công khai. Dùng cho web search, internet search, tin tức
      hoặc khi user chuyển từ Twitter/social sang web. Tin tức dùng topic=news;
      thông tin web không phải tin dùng topic=general. Yêu cầu mới nhất ghi đè
      nguồn tìm kiếm cũ: nếu user nói bỏ Twitter và chuyển sang web thì chỉ gọi
      lookup, không gọi social_search. Không dùng để đọc một URL cụ thể.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Giữ nguyên chủ đề cốt lõi của user; không tự thêm từ news vào query."}
        topic: {type: string, enum: [general, news], default: "general", description: "news cho yêu cầu tin tức; general cho thông tin web không phải tin."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "day cho hôm nay/24 giờ; week cho tuần này; month cho tháng này; year cho năm nay. Giữ constraint thời gian từ lượt trước nếu lượt mới không hủy hoặc thay đổi nó."}
        max_results: {type: integer, default: 5, description: "Số kết quả user yêu cầu; giữ nguyên con số được nêu trong request."}
      required: [query]

  - name: fetch
    description: >-
      Đọc nội dung của một URL cụ thể do user cung cấp. Chỉ dùng khi request
      hiện tại hoặc context hội thoại chứa URL rõ ràng. Nếu user nói bài này
      nhưng không có URL, gọi clarify(response_type=text). Không tự tạo hoặc
      đoán URL. Không dùng để tìm kiếm web.
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "URL http/https cụ thể do user cung cấp trong request hoặc context hội thoại."}
      required: [url]

  - name: format
    description: >-
      Trình bày dữ liệu kết quả đã có thành văn bản định dạng theo khuôn mẫu.
      Dùng sau khi đã thu thập hoặc merge kết quả để tạo bản tin, tóm tắt,
      bản tin bullets hoặc thread. Không dùng để tìm kiếm thông tin hay lấy dữ liệu từ bên ngoài.
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item cần format."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn mẫu format."}
        headline: {type: string, default: "", description: "Tiêu đề của bản tin hoặc tài liệu."}
      required: [items, template]

  - name: merge_sources
    description: >-
      Hợp nhất, chuẩn hóa và loại kết quả trùng từ các research tool sau khi dữ liệu đã được lấy.
      Dùng trước format khi có nhiều nguồn hoặc URL trùng.
      Không dùng để tìm kiếm, đọc URL, fact-check, tóm tắt hoặc trực tiếp trình bày digest.
    parameters:
      type: object
      properties:
        items:
          type: array
          description: "Các result item đã có từ một hoặc nhiều research tool. Mỗi item cần có URL hoặc title để nhận diện."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              date: {type: string}
              section: {type: string}
        dedupe_by:
          type: string
          enum: [auto, url, title]
          default: auto
          description: "Cách nhận diện item trùng: auto ưu tiên URL rồi fallback title; url chỉ dùng URL; title chỉ dùng title."
        max_items:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
          description: "Số item tối đa cần trả về, từ 1 đến 50."
        prefer_source_diversity:
          type: boolean
          default: true
          description: "True để xen kẽ nhiều nguồn trước khi áp dụng max_items; false để giữ thứ tự đầu vào sau dedupe."
      required: [items]

  # ---------------- Bonus tools ----------------
  - name: send
    description: >-
      Gửi chính xác nội dung đã được user xác nhận lên Telegram. Đây là
      side-effect tool. Chỉ gọi với confirmed=true sau khi user đã xác nhận rõ
      nội dung trong hội thoại hiện tại. Nếu chưa xác nhận, gọi
      clarify(response_type=yes_no), không gọi send.
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Chính xác nội dung user đã xem và xác nhận để gửi."}
        confirmed: {type: boolean, default: false, description: "Chỉ true khi user đã xác nhận rõ nội dung cần gửi trong hội thoại hiện tại."}
      required: [text]

  - name: policy
    description: >-
      Tìm kiếm quy định và chính sách nội bộ của tổ chức.
      Dùng khi request liên quan đến nội quy, chính sách xuất bản, trích dẫn, quyền riêng tư dữ liệu hoặc hướng dẫn sử dụng công cụ nội bộ.
      Không dùng cho tin tức bên ngoài, nghiên cứu học thuật hoặc tìm kiếm web công khai.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn tìm kiếm trong văn bản chính sách."}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Lĩnh vực chính sách cần tra cứu."}
        top_k: {type: integer, default: 3, description: "Số điều khoản hoặc đoạn chính sách cần lấy."}
      required: [query]

  - name: papers
    description: >-
      Tìm kiếm các bài báo khoa học và công trình nghiên cứu học thuật (ví dụ qua arXiv).
      Dùng khi user yêu cầu tìm bài báo khoa học, preprint, paper nghiên cứu về chủ đề học thuật hoặc công nghệ chuyên sâu.
      Không dùng cho tin tức thời sự hàng ngày, bài đăng mạng xã hội hay trang web thông thường.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa hoặc chủ đề nghiên cứu học thuật."}
        max_results: {type: integer, default: 5, description: "Số bài báo tối đa cần trả về."}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Tiêu chí sắp xếp kết quả."}
      required: [query]

  - name: paper_text
    description: >-
      Trích xuất toàn văn hoặc nội dung văn bản của một bài báo khoa học cụ thể theo arXiv ID hoặc URL.
      Dùng khi đã có định danh hoặc link arXiv của bài báo và cần phân tích sâu nội dung của bài đó.
      Không dùng để tìm kiếm bài báo mới (dùng papers) hay đọc các trang web thông thường (dùng fetch).
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "arXiv ID hoặc URL bài báo cụ thể."}
        max_pages: {type: integer, default: 5, description: "Số trang tối đa cần đọc."}
        max_chars: {type: integer, default: 8000, description: "Số ký tự tối đa cần trích xuất."}
      required: [arxiv_url]
